# Render Blueprint – serves the Godot web export as a static site.
#
# The web build is produced by GitHub Actions (.github/workflows/build.yml)
# and pushed to the `web-dist` branch; Render only serves that branch.
# Connect the repo in the Render dashboard ("New +" -> "Blueprint") once the
# first main build has created `web-dist`.
#
# The export uses Godot's non-threaded web variant, so no cross-origin
# isolation headers (COOP/COEP) are required; that keeps cross-origin
# requests to virtualflybrain.org working from the browser.
services:
  # ---- API service: holds the Claude key, serves YouTube metadata, narration and
  #      reaction plans. Optional: the app works without it (programmatic mode).
  - type: web
    name: vfb-fly-explorer-api
    runtime: python
    branch: main
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # secret: Render asks you for the value when you create the Blueprint
      - key: VFB_MODEL
        value: claude-opus-5
      - key: PYTHON_VERSION
        value: 3.11.9

  # ---- Static site: the Godot web build published by CI to the web-dist branch.
  - type: web
    name: vfb-fly-explorer
    runtime: static
    branch: web-dist
    buildCommand: echo "prebuilt by GitHub Actions"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
      - path: /*
        name: Cache-Control
        value: public, max-age=300
