<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="description" content="Explore a fruit fly's real brain map inside a walking, flying 3D fly. Show it a video and watch how it reacts.">
		<meta name="theme-color" content="#12151c">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #12151c; overflow: hidden; touch-action: none; font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
#status, #status-splash { top: 0; bottom: 0; }
#status { background-color: $GODOT_SPLASH_COLOR; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
#status-splash { max-height: 100%; max-width: 100%; margin: auto; }
#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true { height: 100%; width: 100%; object-fit: contain; }
#status-splash.use-filter--false { image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }
#status-progress { bottom: 14%; width: min(60%, 320px); margin: 0 auto; height: 8px; accent-color: #57d2ff; }
#status-text { position: absolute; bottom: 18%; left: 0; right: 0; text-align: center; font-size: 15px; color: #cfd6e4; }
#status-text small { display: block; margin-top: 6px; color: #8892a6; font-size: 12px; }
#status-notice { background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0; line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center; z-index: 1; }
#video-wrap { position: absolute; display: none; z-index: 5; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
#video-wrap iframe, #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="video-wrap"><div id="player"></div></div>
		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-text">Loading the fly and its brain map…<small>About 45 MB the first time. Later visits are faster.</small></div>
			<div id="status-notice"></div>
		</div>

		<script>
// ---- app config (read by the Godot side through WebBridge) ----
window.VFB_CONFIG = {
	apiBase: new URLSearchParams(window.location.search).get('api') || 'https://vfb-fly-explorer-api.onrender.com',
};

// ---- YouTube overlay (iframe player controlled from Godot) ----
(function () {
	var wrap = document.getElementById('video-wrap');
	var player = null;
	var pendingId = null;
	var apiReady = false;
	var apiRequested = false;

	function ensureApi() {
		if (apiRequested) { return; }
		apiRequested = true;
		var tag = document.createElement('script');
		tag.src = 'https://www.youtube.com/iframe_api';
		document.head.appendChild(tag);
	}
	window.onYouTubeIframeAPIReady = function () {
		apiReady = true;
		if (pendingId) { createPlayer(pendingId); }
	};
	function notify(state) {
		if (window.vfbBridge && window.vfbBridge.onPlayerState) {
			try { window.vfbBridge.onPlayerState(state); } catch (e) { console.warn(e); }
		}
	}
	function createPlayer(id) {
		if (player) { player.loadVideoById(id); return; }
		player = new YT.Player('player', {
			videoId: id,
			playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
			events: {
				onStateChange: function (e) { notify(e.data); },
			},
		});
	}
	window.vfbLoadVideo = function (id) {
		pendingId = id;
		wrap.style.display = 'block';
		ensureApi();
		if (apiReady) { createPlayer(id); }
	};
	window.vfbStopVideo = function () {
		pendingId = null;
		if (player) { try { player.stopVideo(); } catch (e) {} }
		wrap.style.display = 'none';
		notify(0);
	};
	window.vfbSetVideoRect = function (x, y, w, h, visible) {
		wrap.style.left = x + 'px';
		wrap.style.top = y + 'px';
		wrap.style.width = w + 'px';
		wrap.style.height = h + 'px';
		wrap.style.display = (visible && pendingId) ? 'block' : 'none';
	};
	window.vfbCopy = function (text) {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(text).catch(function () { window.prompt('Copy this link', text); });
		} else {
			window.prompt('Copy this link', text);
		}
	};
}());
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusText = document.getElementById('status-text');
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) { return; }
		if (mode === 'hidden') { statusOverlay.remove(); initializing = false; return; }
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function setStatusNotice(text) {
		while (statusNotice.lastChild) { statusNotice.removeChild(statusNotice.lastChild); }
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}
	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) { setStatusNotice(err.message); }
		else if (typeof err === 'string') { setStatusNotice(err); }
		else { setStatusNotice('An unknown error occurred.'); }
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('Sorry, this browser cannot run the 3D fly.\nIt needs WebGL 2 and WebAssembly. Try a current Chrome, Firefox, Safari or Edge.\n\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusText.firstChild.nodeValue = 'Loading the fly and its brain map… ' + Math.round(100 * current / total) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => { setStatusMode('hidden'); }, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
